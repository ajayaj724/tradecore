version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the pin and the # vX comment together).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # wait a week before proposing a newly published version (supply-chain safety)
    commit-message:
      prefix: ci
  # Maven dependency updates (Boot BOM-managed versions are surfaced but usually held to the BOM).
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
