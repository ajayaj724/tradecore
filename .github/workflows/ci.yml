name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with: {distribution: temurin, java-version: "25", cache: maven}
      - run: mvn -B spotless:check verify

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8
        with: {python-version: "3.12"}
      - working-directory: mcp
        run: uv run pytest -q

  codeql:
    runs-on: ubuntu-latest
    permissions: {security-events: write, contents: read, actions: read}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with: {distribution: temurin, java-version: "25", cache: maven}
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3
        with: {languages: java}
      - run: mvn -B -DskipTests compile
      - uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3

  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # p/spring was retired from the Semgrep registry (404); p/java + p/owasp-top-ten cover the app.
      - run: semgrep scan --config p/java --config p/owasp-top-ten --error

  gitleaks:
    runs-on: ubuntu-latest
    # pull-requests: write lets the action post its PR summary; without it, PR runs 404 on the API.
    permissions: {contents: read, pull-requests: write}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  owasp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with: {distribution: temurin, java-version: "25", cache: maven}
      # Runs only when an NVD_API_KEY repo secret is set (the NVD feed is unusable without a key).
      # Trivy (the image job) already scans dependency CVEs on every build.
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY secret not set — skipping OWASP Dependency-Check. Add it to enable."
            exit 0
          fi
          mvn -B org.owasp:dependency-check-maven:12.2.2:check \
            -DnvdApiKey="$NVD_API_KEY" -DfailBuildOnCVSS=7

  image:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - run: docker build -t tradecore:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tradecore:ci
          exit-code: "1"
          severity: CRITICAL,HIGH
