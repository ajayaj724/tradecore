name: tradecore
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: tradecore
      POSTGRES_USER: tradecore
      POSTGRES_PASSWORD: tradecore
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      # postgres:18+ stores data in a major-version subdirectory and refuses to start when the
      # volume is mounted at the old /var/lib/postgresql/data path; mount the parent instead.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradecore"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/tradecore-realm.json:/opt/keycloak/data/import/tradecore-realm.json:ro
    # Both loopback stacks: Node ≥20 resolves `localhost` to ::1 first, so the BFF's OIDC
    # discovery needs the IPv6 binding too; still never exposed beyond this machine.
    ports: ["127.0.0.1:8081:8080", "[::1]:8081:8080"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.155.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports: ["127.0.0.1:4318:4318"]

  tempo:
    image: grafana/tempo:3.0.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
    # brief's Step 4 verification curls localhost:3200 from the host; loopback-bound
    # per the same security policy as the other published ports.
    ports: ["127.0.0.1:3200:3200"]

  loki:
    image: grafana/loki:3.7.3

  prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:13.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
