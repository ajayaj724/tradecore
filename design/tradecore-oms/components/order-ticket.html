<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Order ticket · tradecore OMS</title>
<style>
  :root{
    --paper:#F7F5F0;--panel:#FFFDF8;--ink:#14181F;--ink2:#5A616B;--ink3:#8B9099;--line:#E4DFD3;--line2:#D3CCBC;
    --buy:#0E7C66;--buybg:#E7F1ED;--sell:#C0392B;--gold:#9A7B2E;--goldbg:#F1EAD7;
    --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:"Helvetica Neue",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;padding:32px;display:flex;justify-content:center}
  .ticket{width:340px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;overflow:hidden}
  .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
  .head .t{font-size:14px;font-weight:700} .head .sym{font-family:var(--mono);font-weight:700;font-size:13px}
  .body{padding:18px}
  .seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;margin-bottom:14px}
  .seg button{flex:1;font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:9px 0;border:none;background:var(--panel);color:var(--ink2);cursor:pointer}
  .seg button + button{border-left:1px solid var(--line)}
  .seg .on-buy{background:var(--buy);color:#fff}
  .type{display:flex;gap:8px;margin-bottom:16px}
  .type button{flex:1;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:7px 0;border:1px solid var(--line2);border-radius:3px;background:var(--panel);color:var(--ink2);cursor:pointer}
  .type .on{background:var(--ink);color:#F7F5F0;border-color:var(--ink)}
  .field{margin-bottom:14px}
  .field .cap{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between}
  .affix{position:relative}
  .affix .rup{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);font-family:var(--mono);font-size:16px}
  .input{width:100%;border:1px solid var(--line2);border-radius:3px;background:var(--paper);padding:11px 12px 11px 24px;
    font-family:var(--mono);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .input.plain{padding-left:12px}
  .summary{border-top:1px solid var(--line);margin-top:4px;padding-top:14px;font-size:12px}
  .summary .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--ink2)}
  .summary .r .num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  .summary .r.k .num{font-weight:700}
  .place{width:100%;margin-top:16px;padding:13px 0;border:none;border-radius:3px;background:var(--buy);color:#fff;
    font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.02em;cursor:pointer}
  .hint{font-size:11px;color:var(--ink3);margin-top:10px;text-align:center}
</style>
</head>
<body>
  <div class="ticket">
    <div class="head"><span class="t">New order</span><span class="sym">ACME</span></div>
    <div class="body">
      <div class="seg"><button class="on-buy">BUY</button><button>SELL</button></div>
      <div class="type"><button class="on">LIMIT</button><button>MARKET</button></div>

      <div class="field">
        <div class="cap"><span>Limit price</span><span>per share</span></div>
        <div class="affix"><span class="rup">₹</span><input class="input" value="100.00" /></div>
      </div>
      <div class="field">
        <div class="cap"><span>Quantity</span><span>shares</span></div>
        <input class="input plain" value="5" />
      </div>

      <div class="summary">
        <div class="r"><span>Order value</span><span class="num">₹500.00</span></div>
        <div class="r k"><span>Reserved from cash</span><span class="num">₹500.00</span></div>
        <div class="r"><span>Available after</span><span class="num">₹9,99,500.00</span></div>
      </div>

      <button class="place">Buy 5 ACME</button>
      <p class="hint">Pre-trade risk checks cash before the order rests.</p>
    </div>
  </div>
</body>
</html>
