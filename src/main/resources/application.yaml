spring:
  application:
    name: tradecore
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # Flyway owns all schema (Task 6)
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/tradecore
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
