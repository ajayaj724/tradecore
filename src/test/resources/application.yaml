# Spring Boot resolves the default classpath:/application.yaml location as a single resource, so
# having this file at all means it REPLACES src/main/resources/application.yaml for tests rather
# than merging with it (classpath lookup is singular, not additive across classpath roots). This
# file therefore mirrors the main config, plus one addition: jwk-set-uri makes JwtDecoder
# construction lazy — otherwise Boot pings the real issuer's /.well-known/openid-configuration at
# context startup, which would break every @SpringBootTest IT in CI where Keycloak isn't running.
# Mock-jwt-based tests never hit this URI; tests that exercise the real decoder supply their own
# JwtDecoder bean.
spring:
  application:
    name: tradecore
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false   # Flyway owns all schema (Task 6)
      republish-outstanding-events-on-restart: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/tradecore
          jwk-set-uri: http://localhost:9999/unused
tradecore:
  reconciliation:
    initial-delay-ms: 3600000
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
resilience4j:
  circuitbreaker:
    circuitbreaker-aspect-order: 1   # lower = outer: CB wraps Retry so retries happen inside one CB call
    instances:
      upstox:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    retry-aspect-order: 2            # higher = inner: Retry retries the actual call before CB records one failure
    instances:
      upstox:
        max-attempts: 3
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
